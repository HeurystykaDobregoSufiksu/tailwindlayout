<div
  [class]="itemClasses()"
  (click)="onClick()"
  role="option"
  [attr.aria-selected]="selected()"
  [attr.aria-disabled]="disabled()"
>
  <!-- Checkbox indicator -->
  <div class="shrink-0 size-5 flex items-center justify-center border-2 rounded transition-all duration-200"
       [class.bg-brand-primary]="selected()"
       [class.border-brand-primary]="selected()"
       [class.border-ui-border]="!selected()"
       [class.dark:border-ui-border-dark]="!selected()">
    @if (selected()) {
      <svg class="size-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
      </svg>
    }
  </div>

  @if (icon()) {
    <div class="shrink-0 size-5 text-ui-text-secondary dark:text-ui-text-secondary-dark" [innerHTML]="safeIcon()"></div>
  }

  <span class="flex-1 truncate text-ui-text-primary dark:text-ui-text-primary-dark">{{ label() }}</span>
</div>
