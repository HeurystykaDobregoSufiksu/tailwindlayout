<button
  (click)="onClick()"
  [ngClass]="{
    'text-white bg-brand-gradient shadow-card': button.active,
    'text-secondary hover:text-indigo-600 dark:hover:text-indigo-400 hover-bg-brand': !button.active
  }"
  class="flex items-center px-3 py-2 text-sm font-medium rounded-card whitespace-nowrap transition-colors-base">
  <svg class="size-icon-sm mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <g [innerHTML]="getSafeIcon()"></g>
  </svg>
  {{ button.label }}
</button>
