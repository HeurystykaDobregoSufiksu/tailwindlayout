<button
  (click)="onClick()"
  [disabled]="disabled"
  [ngClass]="{
    'px-4 py-2 text-sm': size === 'sm' || !size,
    'px-5 py-2.5 text-sm': size === 'md',
    'px-6 py-3 text-base': size === 'lg',
    'bg-brand-gradient hover:from-indigo-700 hover:to-indigo-800 text-white shadow-button hover:shadow-button-hover': variant === 'primary' || !variant,
    'bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200': variant === 'secondary',
    'bg-transparent border-2 border-indigo-600 dark:border-indigo-500 text-indigo-600 dark:text-indigo-400 hover-bg-brand': variant === 'outline',
    'opacity-50 cursor-not-allowed': disabled
  }"
  class="rounded-card font-medium transition-colors-base flex w-full items-center justify-center space-x-2">
  @if (icon) {
    <svg class="size-icon-xs" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <g [innerHTML]="safeIcon"></g>
    </svg>
  }
  <span>{{ label }}</span>
</button>
