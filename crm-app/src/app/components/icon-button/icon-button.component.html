<button
  (click)="onClick()"
  [attr.aria-label]="config.ariaLabel"
  class="p-2 text-secondary hover:text-indigo-600 dark:hover:text-indigo-400 hover-bg-brand rounded-card transition-colors-base">
  <svg class="size-icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <g [innerHTML]="getSafeIcon()"></g>
  </svg>
</button>
