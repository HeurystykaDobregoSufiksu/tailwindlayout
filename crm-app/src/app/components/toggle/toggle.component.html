<div class="flex items-center gap-3">
  @if (icon()) {
    <div
      class="shrink-0 text-ui-text-secondary dark:text-ui-text-secondary-dark flex items-center"
      [innerHTML]="safeIcon()"
    ></div>
  }

  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked()"
    [attr.aria-label]="label() || 'Toggle switch'"
    [disabled]="disabled()"
    [class]="toggleClasses()"
    (click)="onToggle()"
  >
    <span [class]="switchClasses()"></span>
  </button>

  @if (label()) {
    <span [class]="labelClasses()">{{ label() }}</span>
  }
</div>
