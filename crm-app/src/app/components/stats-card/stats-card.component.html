<div [ngClass]="stat.gradient" class="rounded-card-large p-4 text-white shadow-card">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center space-x-2">
      <div class="size-avatar-md bg-white/20 rounded-card flex items-center justify-center">
        <svg class="size-icon-sm" fill="currentColor" viewBox="0 0 20 20">
          <g [innerHTML]="getSafeIcon()"></g>
        </svg>
      </div>
      <div>
        <p class="text-2xl font-bold">{{ stat.value }}</p>
        <p class="text-xs opacity-90">{{ stat.label }}</p>
      </div>
    </div>

  </div>
</div>
