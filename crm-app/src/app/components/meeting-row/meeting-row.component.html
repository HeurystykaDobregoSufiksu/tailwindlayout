<div class="flex items-center gap-4 p-3 mb-2 border-default">
  <!-- Avatar -->
  <img
    [src]="avatarUrl()"
    [alt]="personName()"
    class="w-12 h-12 rounded-full object-cover flex-shrink-0"
  />

  <!-- Text Content -->
  <div class="flex-1 min-w-0">
    <!-- Person Name -->
    <h3 class="text-base font-medium text-primary truncate">
      {{ personName() }}
    </h3>

    <!-- Metadata Row -->
    <div class="flex items-center gap-2 mt-1 text-sm text-secondary">
      <!-- Calendar Icon -->
      <svg
        class="size-icon-xs flex-shrink-0"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g [innerHTML]="safeCalendarIcon"></g>
      </svg>

      <!-- Date/Time -->
      <span class="truncate">{{ dateTimeLabel() }}</span>

      <!-- Separator -->
      <span class="text-gray-400 dark:text-gray-600">|</span>

      <!-- Map Pin Icon -->
      <svg
        class="size-icon-xs flex-shrink-0"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g [innerHTML]="safeMapPinIcon"></g>
      </svg>

      <!-- Location -->
      <span class="truncate">{{ locationLabel() }}</span>
    </div>
  </div>

  <!-- Actions Menu -->
  <app-dropdown-button  [variant]="'text'" >
    <app-dropdown-option [label]="'test2'">
      test
    </app-dropdown-option>
  </app-dropdown-button>
</div>
