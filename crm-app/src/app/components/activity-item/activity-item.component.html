<div class="flex items-start space-x-4">
  <div
  
    class="bg-slate-300/50 dark:bg-slate-900/50  flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center">
    <svg
      
      class="w-5 h-5 fill-slate-600 dark:text-slate-100 dark:fill-slate-100" viewBox="0 0 20 20">
      <g [innerHTML]="getSafeIcon() "></g>
    </svg>
  </div>
  <div class="flex-1 flex-col">
    <p class="text-sm text-slate-800 dark:text-slate-200">
      <span class="font-semibold">{{ activity.user }}</span>

    </p>
    <p class="text-sm text-slate-800 dark:text-slate-200">      {{ activity.action }}
      <span class=" font-bold text-slate-800 dark:text-slate-200" > - {{ activity.target }}</span></p>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ activity.time }}</p>
  </div>
</div>
