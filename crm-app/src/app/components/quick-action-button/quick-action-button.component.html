<button
  (click)="onActionClick()"
  class="w-full bg-card hover-bg-brand border border-default hover:border-indigo-300 dark:hover:border-indigo-600 text-slate-700 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 px-4 py-2.5 rounded-card text-sm font-medium flex items-center space-x-2 transition-colors-base">
  <svg class="size-icon-xs" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <g [innerHTML]="getSafeIcon()"></g>
  </svg>
  <span>{{ action.label }}</span>
</button>
